[tool.poetry]
name = "taskparser"
version = "0.1.0"
description = ""
authors = ["Daniil Tarasov <danya.tarasov.01@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
psycopg2-binary = "^2.9.11"
sqlalchemy = "^2.0.45"
redis = "^7.1.0"
celery = "^5.6.2"
requests = "^2.32.5"
python-dotenv = "^1.2.1"
alembic = "^1.18.1"
pytest = "^9.0.2"
aiogram = ">=3.13,<3.15"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "strict"
addopts = "--strict-markers --tb=short"
markers = [
    "asyncio: marks test as asyncio",
    "celery: marks test as celery task test"
]


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.12.0"
isort = "^7.0.0"


[tool.poetry.group.test.dependencies]
requests-mock = "^1.12.1"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[tool.celery]
accept_content = ["json"]
task_serializer = "json"
result_serializer = "json"
timezone = "UTC"
enable_utc = true
